# Fails any push or pull request that would stop the scripts from loading in
# Deadline's Fiu VM (see tools/check_fiu_compat.py), that has an out-of-date
# client_autorun.txt bundle, or that breaks the tests, which run the console
# scripts under the luau CLI.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch: # Actions > Check > Run workflow: try another runner image before moving the pin
    inputs:
      runner:
        description: "Runner image, e.g. ubuntu-26.04"
        default: ubuntu-24.04

jobs:
  check:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }} # pinned: ubuntu-latest becomes Ubuntu 26 from 2026-10-19; move up on purpose, after a test run
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-luau

      - name: Fiu load check
        run: python tools/check_fiu_compat.py

      - name: Client autorun check
        run: python tools/build_client_autorun.py --check

      - name: Tests
        run: python -m unittest discover -s tests -v
