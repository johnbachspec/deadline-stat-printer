# Fails any push or pull request that would stop the scripts from loading in
# Deadline's Fiu VM (see tools/check_fiu_compat.py) or that breaks the tests,
# which run the console scripts under the luau CLI.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-luau

      - name: Fiu load check
        run: python tools/check_fiu_compat.py

      - name: Tests
        run: python -m unittest discover -s tests -v
