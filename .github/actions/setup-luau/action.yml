name: Set up Luau
description: Installs the luau and luau-compile CLIs and points LUAU_BIN at them (read by tools/deadline_data.py).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -sSfL -o "$RUNNER_TEMP/luau.zip" https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
        unzip -q -o "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
        chmod +x "$RUNNER_TEMP/luau/luau" "$RUNNER_TEMP/luau/luau-compile"
        echo "LUAU_BIN=$RUNNER_TEMP/luau" >> "$GITHUB_ENV"
